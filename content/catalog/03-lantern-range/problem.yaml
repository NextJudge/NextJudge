prompt: |
  # Lantern Range

  A row of lanterns reports brightness levels. Operators ask for the total brightness
  between any two lanterns (inclusive).

  Build a prefix-sum array so each range query `[L, R]` (1-indexed) can be answered
  in constant time.

  ## Input

  - Line 1: integer `n` (`1 ≤ n ≤ 100000`)
  - Line 2: `n` integers `a_1 … a_n` (`0 ≤ a_i ≤ 10^9`)
  - Line 3: integer `q` (`1 ≤ q ≤ 100000`) — number of queries
  - Next `q` lines: two integers `L` and `R` (`1 ≤ L ≤ R ≤ n`)

  ## Output

  For each query, print the sum of `a_L + … + a_R` on its own line.

  ## Examples

  **Input**
  ```
  5
  2 4 1 3 5
  3
  1 3
  2 5
  3 3
  ```

  **Output**
  ```
  7
  13
  1
  ```

  **Input**
  ```
  3
  10 20 30
  1
  1 3
  ```

  **Output**
  ```
  60
  ```
