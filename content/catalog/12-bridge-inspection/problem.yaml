prompt: |
  # Bridge Inspection

  A road network is an undirected connected graph. A **bridge** is an edge whose removal
  increases the number of connected components.

  Count how many bridges the network has.

  ## Input

  - Line 1: integers `n` and `m` (`2 ≤ n ≤ 100000`, `n - 1 ≤ m ≤ 200000`)
  - Next `m` lines: integers `u` and `v` (`1 ≤ u < v ≤ n`) — an undirected road

  The graph is connected and has no duplicate edges.

  ## Output

  Print the number of bridges.

  ## Examples

  **Input**
  ```
  4 4
  1 2
  2 3
  3 4
  2 4
  ```

  **Output**
  ```
  1
  ```

  Explanation: only edge `(3,4)` is a bridge.

  **Input**
  ```
  3 3
  1 2
  2 3
  1 3
  ```

  **Output**
  ```
  0
  ```
