prompt: |
  # Orbit Window

  A satellite records signal strengths along its orbit. For each consecutive window of
  length `k`, report the **minimum** reading.

  ## Input

  - Line 1: integers `n` and `k` (`1 ≤ k ≤ n ≤ 200000`)
  - Line 2: `n` integers (`-10^9 ≤ value ≤ 10^9`)

  ## Output

  Print `n - k + 1` integers separated by spaces: the minimum in each window.

  ## Examples

  **Input**
  ```
  8 3
  1 3 -1 -3 5 3 6 7
  ```

  **Output**
  ```
  -1 -3 -3 -3 3 3
  ```

  **Input**
  ```
  5 2
  9 1 8 2 7
  ```

  **Output**
  ```
  1 1 2 2
  ```
