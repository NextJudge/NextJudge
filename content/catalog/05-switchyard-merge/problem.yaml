prompt: |
  # Switchyard Merge

  Two sorted conveyor belts feed crates into a switchyard. Merge both streams into one
  sorted output sequence without re-sorting.

  ## Input

  - Line 1: integers `m` and `n` — lengths of the two lists
  - Line 2: `m` integers in non-decreasing order
  - Line 3: `n` integers in non-decreasing order

  ## Output

  Print `m + n` integers: the merged sorted list, separated by spaces.

  ## Examples

  **Input**
  ```
  3 4
  1 3 5
  2 4 6 8
  ```

  **Output**
  ```
  1 2 3 4 5 6 8
  ```

  **Input**
  ```
  2 2
  1 2
  3 4
  ```

  **Output**
  ```
  1 2 3 4
  ```
