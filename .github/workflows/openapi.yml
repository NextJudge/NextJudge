name: OpenAPI

on:
  pull_request:
    paths:
      - 'openapi/**'
      - 'src/data-layer/openapi/**'
      - 'scripts/lint-openapi.sh'
      - '.redocly.yaml'
      - '.github/workflows/openapi.yml'
  push:
    branches: [main]
    paths:
      - 'openapi/**'
      - 'src/data-layer/openapi/**'
      - 'scripts/lint-openapi.sh'
      - '.redocly.yaml'
      - '.github/workflows/openapi.yml'

concurrency:
  group: openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint OpenAPI spec
        run: bash scripts/lint-openapi.sh
